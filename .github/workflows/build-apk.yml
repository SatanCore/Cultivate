name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import selected character portraits from art library
        run: |
          mkdir -p /tmp/cultivate-art
          unzip -oq Cultivate_ART_SOURCE_EXPANDED_PART_01.zip -d /tmp/cultivate-art
          for archive in art_source/Cultivate_ART_SOURCE_EXPANDED_PART_*.zip; do
            unzip -oq "$archive" -d /tmp/cultivate-art
          done
          # Build a factual inventory of every raster illustration in the supplied archive set.
          {
            echo "# Cultivate art source inventory"
            echo
            echo "Generated from all 14 source archives during CI."
            echo
            echo "| Asset path | File type and dimensions |"
            echo "|---|---|"
            find /tmp/cultivate-art -type f \
              \( -iname "*.png" -o -iname "*.webp" -o -iname "*.jpg" -o -iname "*.jpeg" \) \
              -print0 | sort -z | while IFS= read -r -d "" asset; do
                details=$(file -b "$asset" | tr "|" "/")
                printf "| `%s` | %s |\n" "${asset#/tmp/cultivate-art/}" "$details"
              done
          } > ART_ASSET_INVENTORY.md
          source_dir="/tmp/cultivate-art/art_source/01_ready_alpha_assets/characters"
          target_dir="app/src/main/res/drawable-nodpi"
          test -s "$source_dir/blademaster_male_14118cf4.png"
          cp "$source_dir/blademaster_male_14118cf4.png" "$target_dir/blademaster_male.png"
          cp "$source_dir/blademaster_female_53a87051.png" "$target_dir/blademaster_female.png"
          cp "$source_dir/ironbody_male_891e8b8b.png" "$target_dir/ironbody_male.png"
          cp "$source_dir/ironbody_female_c5adf06c.png" "$target_dir/ironbody_female.png"
          cp "$source_dir/elementalist_male_2e9f9bc1.png" "$target_dir/elementalist_male.png"
          cp "$source_dir/elementalist_female_bd6c47c4.png" "$target_dir/elementalist_female.png"
          cp "$source_dir/spiritmystic_male_6ca05db4.png" "$target_dir/spiritmystic_male.png"
          cp "$source_dir/spiritmystic_female_446e7fa6.png" "$target_dir/spiritmystic_female.png"
          # Import full-body class artwork and clean, transparent creature illustrations.
          cp "$source_dir/character_full_blademaster_5dc1eacc.webp" "$target_dir/hero_full_blademaster.webp"
          cp "$source_dir/character_full_elementalist_9126bc7a.webp" "$target_dir/hero_full_elementalist.webp"
          cp "$source_dir/character_full_ironbody_804ca338.webp" "$target_dir/hero_full_ironbody.webp"
          cp "$source_dir/character_full_spiritmystic_d5ac6aff.webp" "$target_dir/hero_full_spiritmystic.webp"
          creature_dir="/tmp/cultivate-art/art_source/01_ready_alpha_assets/creatures"
          cp "$creature_dir/celestial_dragon_6a4b5e9a.png" "$target_dir/creature_celestial_dragon.png"
          cp "$creature_dir/magma_warlord_tiger_9118f812.png" "$target_dir/creature_magma_tiger.png"
          cp "$creature_dir/frost_phoenix_aafa8bf5.png" "$target_dir/creature_frost_phoenix.png"
          cp "$creature_dir/abyssal_demon_lord_b8aa0238.png" "$target_dir/creature_abyssal_lord.png"
          cp "$creature_dir/jade_qilin_85e3d4a2.png" "$target_dir/creature_jade_qilin.png"
          cp "$creature_dir/nine_tailed_fox_e79a3545.png" "$target_dir/creature_nine_tailed_fox.png"
          # Three transparent rarity frames for icon slots and collection tiles.
          interface_dir="/tmp/cultivate-art/art_source/01_ready_alpha_assets/interface"
          cp "$interface_dir/rarity_frame_01_e6dd0bdb.png" "$target_dir/ui_rarity_frame_01.png"
          cp "$interface_dir/rarity_frame_02_9373d96b.png" "$target_dir/ui_rarity_frame_02.png"
          cp "$interface_dir/rarity_frame_03_d6abb656.png" "$target_dir/ui_rarity_frame_03.png"
          # Import the supplied 12-frame, 512x288 spiritual-water animation as
          # independent Android drawable-nodpi assets for the spring scene.
          spring_frames_dir="/tmp/cultivate-art/art_source/animations_expanded/animated_scenes/spiritual_realm_water"
          for frame in 00 01 02 03 04 05 06 07 08 09 10 11; do
            test -s "$spring_frames_dir/frame_${frame}.png"
            cp "$spring_frames_dir/frame_${frame}.png" "$target_dir/spirit_spring_frame_${frame}.png"
          done
          # Import two 12-frame, 256px cultivation auras. The gold sequence
          # serves the first three Dao worlds; the void sequence marks Chaos.
          aura_source_dir="/tmp/cultivate-art/art_source/animations_expanded/characters"
          for frame in 00 01 02 03 04 05 06 07 08 09 10 11; do
            test -s "$aura_source_dir/cultivation_aura_gold/frame_${frame}.png"
            test -s "$aura_source_dir/cultivation_aura_void/frame_${frame}.png"
            cp "$aura_source_dir/cultivation_aura_gold/frame_${frame}.png" "$target_dir/cultivation_aura_gold_${frame}.png"
            cp "$aura_source_dir/cultivation_aura_void/frame_${frame}.png" "$target_dir/cultivation_aura_void_${frame}.png"
          done
          # Separate transparent effects are layered only during a successful breakthrough.
          effects_source_dir="/tmp/cultivate-art/art_source/02_processed_304/transparent_sprites/combat_and_effects"
          cp "$effects_source_dir/ascension_rays_c7a7e8af.png" "$target_dir/cultivation_ascension_rays.png"
          cp "$effects_source_dir/breakthrough_ascension_bf7758b4.png" "$target_dir/cultivation_breakthrough_ascension.png"
          cp "$effects_source_dir/event_breakthrough_ea680001.png" "$target_dir/cultivation_event_breakthrough.png"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target_dir"/*_male.png "$target_dir"/*_female.png "$target_dir"/hero_full_*.webp "$target_dir"/creature_*.png "$target_dir"/ui_rarity_frame_*.png "$target_dir"/spirit_spring_frame_*.png "$target_dir"/cultivation_aura_*.png "$target_dir"/cultivation_ascension_rays.png "$target_dir"/cultivation_breakthrough_ascension.png "$target_dir"/cultivation_event_breakthrough.png ART_ASSET_INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m "Inventory supplied illustration library and import portraits"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2.1'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cultivate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
